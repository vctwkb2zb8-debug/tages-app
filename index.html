<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Zeichensatz: damit Umlaute (ä, ö, ü) richtig angezeigt werden -->
  <meta charset="UTF-8">
  <!-- Damit die Seite auf dem Handy nicht winzig verkleinert dargestellt wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tages-App</title>
  <!-- Verbindet die Seite mit der Datei für das Aussehen -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Meine Tages-App</h1>

  <section id="heute">
    <h2>Heute</h2>
    <p>Hier siehst du später, was heute noch offen ist.</p>
  </section>

  <section id="checkliste">
    <h2>Checkliste</h2>
    <!-- Die Punkte füllt app.js hier automatisch hinein -->
    <ul id="checkliste-liste"></ul>

    <!-- Neuen Punkt hinzufügen -->
    <form id="checkliste-neu">
      <input id="checkliste-neu-name" placeholder="Neuer Punkt, z. B. Lesen" required>
      <button type="submit">Hinzufügen</button>
    </form>
  </section>

  <section id="tagebuch">
    <h2>Tagebuch</h2>
    <!--
      Jedes Feld sagt mit data-art, in welche Liste es gehört,
      und mit data-nr, die wievielte Zeile es ist (0, 1, 2).
    -->
    <h3>Wofür ich dankbar bin</h3>
    <input class="tagebuch-feld" data-art="dankbar" data-nr="0" placeholder="1.">
    <input class="tagebuch-feld" data-art="dankbar" data-nr="1" placeholder="2.">
    <input class="tagebuch-feld" data-art="dankbar" data-nr="2" placeholder="3.">

    <h3>Was ich heute für mich getan habe</h3>
    <input class="tagebuch-feld" data-art="fuerMich" data-nr="0" placeholder="1.">
    <input class="tagebuch-feld" data-art="fuerMich" data-nr="1" placeholder="2.">
    <input class="tagebuch-feld" data-art="fuerMich" data-nr="2" placeholder="3.">

    <h3>Frühere Tage</h3>
    <!-- Das Archiv füllt app.js hier automatisch hinein -->
    <div id="tagebuch-archiv"></div>
  </section>

  <section id="todos">
    <h2>ToDos</h2>
    <!-- Neue Aufgabe: Text und (freiwillig) ein Datum -->
    <form id="todo-neu">
      <input id="todo-neu-text" placeholder="Neue Aufgabe" required>
      <input id="todo-neu-datum" type="date" title="Fällig am (freiwillig)">
      <button type="submit">Hinzufügen</button>
    </form>

    <!-- Die Aufgaben füllt app.js hier automatisch hinein -->
    <ul id="todo-liste"></ul>
  </section>

  <!-- Untere Leiste zum Umschalten. data-bereich sagt, welche section der Knopf zeigt. -->
  <nav>
    <button data-bereich="heute">Heute</button>
    <button data-bereich="checkliste">Checkliste</button>
    <button data-bereich="tagebuch">Tagebuch</button>
    <button data-bereich="todos">ToDos</button>
  </nav>

  <!-- Das JavaScript kommt ganz ans Ende, damit die Bereiche schon geladen sind -->
  <script src="app.js"></script>
</body>
</html>
